
name: CI — Training Pipeline

on:
  push:
    branches:
      - master

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      MLFLOW_ALLOW_FILE_STORE: "true"

    steps:
      # Download the repository files onto the runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Install the Python version used in development
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install all project libraries
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Download Diabetes dataset and save to data/raw/
      - name: Load raw data
        run: python src/data/load_data.py

      # Check field types and required columns with Pydantic
      - name: Validate data
        run: python src/data/validate_data.py

      # Fill nulls, fix types, remove outliers
      - name: Preprocess data
        run: python src/data/preprocess.py

      # Add engineered features
      - name: Feature engineering
        run: python src/data/feature_engineering.py

      # Train models and log runs to MLflow
      - name: Train models
        run: python src/models/train.py

      # Register the best run in the MLflow Model Registry
      - name: Register model
        run: python src/models/register_model.py

      # Evaluate model and assign the champion alias
      - name: Evaluate model
        run: python src/models/evaluate_model.py
